name: DNSControl - Validate & Preview

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
    branches:
      - main

concurrency:
  group: dns-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'DNS Update') &&
      (github.event.action != 'labeled' || github.event.label.name == 'DNS Update')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Preview DNSControl Changes
        uses: DNSControl/dnscontrol-action@v1.4.0
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          check: true
          cmdargs: preview --notify
          post_pr_comment: true
          post_summary: true
